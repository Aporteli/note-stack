[package]
name = "note-stack"
version = "0.1.0"
description = "Note-Stack"
edition = "2021"

[lib]
name = "note_stack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "note-stack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
url = "2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
